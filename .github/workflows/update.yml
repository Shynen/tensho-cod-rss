name: Update COD RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Restore Argos cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: argos-en-fr-${{ runner.os }}-v1
          restore-keys: |
            argos-en-fr-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4 argostranslate

      - name: Generate RSS
        run: python generate_cod_rss.py

      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cod.rss cod_cache.json
          git diff --cached --quiet || git commit -m "Update COD RSS feed"
          git push
