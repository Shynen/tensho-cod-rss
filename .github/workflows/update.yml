- name: Install dependencies
  run: |
    python -m pip install requests beautifulsoup4 argostranslate

- name: Generate RSS
  run: python generate_cod_rss.py

- name: Commit generated feed
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    git add cod.xml
    git diff --cached --quiet || git commit -m "Update COD RSS feed"
    git push
