name: Test Translation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Argos Translate
        run: pip install argostranslate

      - name: Test EN to FR
        run: python test_translation.py
